<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <main class="gallery">

        <!-- 1. Beautiful Nature -->
        <div class="image-card">
            <img src="images/img1.jpg" alt="Beautiful Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <!-- 2. Cute Cat Mug -->
        <div class="image-card">
            <img src="images/img2.jpg" alt="Cute Cat Mug">
            <div class="caption">Cute Cat Mug</div>
        </div>

        <!-- 3. Amazing Cave -->
        <div class="image-card">
            <img src="images/img3.jpg" alt="Amazing Cave">
            <div class="caption">Amazing Cave</div>
        </div>

        <!-- 4. Mountain -->
        <div class="image-card">
            <img src="images/img4.jpg" alt="Mountain View">
            <div class="caption">Mountain View</div>
        </div>

        <!-- 5. Flower -->
        <div class="image-card">
            <img src="images/img5.jpg" alt="Beautiful Flower">
            <div class="caption">Beautiful Flower</div>
        </div>

        <!-- 6. Lake -->
        <div class="image-card">
            <img src="images/img6.jpg" alt="Peaceful Lake">
            <div class="caption">Peaceful Lake</div>
        </div>

    </main>

</body>
</html>
