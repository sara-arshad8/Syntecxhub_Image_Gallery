<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <main class="gallery">

        <div class="image-card">
            <img src="images/img1.jpg" alt="Gallery Image 1">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="image-card">
            <img src="images/img2.jpg" alt="Gallery Image 2">
            <div class="caption">Mountain View</div>
        </div>

        <div class="image-card">
            <img src="images/img3.jpg" alt="Gallery Image 3">
            <div class="caption">Peaceful Scene</div>
        </div>

        <div class="image-card">
            <img src="images/img4.jpg" alt="Gallery Image 4">
            <div class="caption">Amazing Landscape</div>
        </div>

        <div class="image-card">
            <img src="images/img5.jpg" alt="Gallery Image 5">
            <div class="caption">Natural Beauty</div>
        </div>

        <div class="image-card">
            <img src="images/img6.jpg" alt="Gallery Image 6">
            <div class="caption">Wonderful View</div>
        </div>

    </main>

</body>
</html>
